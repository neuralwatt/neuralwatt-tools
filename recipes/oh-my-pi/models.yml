# Oh My Pi model catalog for Neuralwatt.
#
# Copy to ~/.omp/agent/models.yml and export NEURALWATT_API_KEY.
#
# Neuralwatt is not in omp's built-in catalog, so this file is the entire
# definition. `neuralwatt` is the provider id used in model selectors
# (neuralwatt/<id>).
#
# The live endpoint is the source of truth: GET https://api.neuralwatt.com/v1/models
# reports ids, context limits, pricing, and capability flags per account.
# Run `omp models refresh` after editing this file.
#
# `*-flex` entries carry the standard per-token rate reported by /v1/models.
# Flex is the discounted async tier: the discount is applied at billing, not
# published per model, so these figures are only an upper bound on the bill.

providers:
  neuralwatt:
    baseUrl: https://api.neuralwatt.com/v1
    api: openai-completions
    apiKey: NEURALWATT_API_KEY
    authHeader: true
    compat:
      # Neuralwatt rejects the `developer` role (expects `system`) and accepts
      # reasoning_effort on most models. Per-model overrides deep-merge on top.
      supportsDeveloperRole: false
      supportsReasoningEffort: true

    # `cost` is per million tokens. `cacheWrite` is always 0 — Neuralwatt does
    # not charge for cache writes.

    models:
      # ---- GLM family -------------------------------------------------------
      - id: glm-5.3
        name: GLM-5.3
        reasoning: true
        input: [text]
        contextWindow: 1048560
        maxTokens: 65536
        cost: { input: 1.45, output: 4.50, cacheRead: 0.145, cacheWrite: 0 }
      - id: glm-5.3-flex
        name: GLM-5.3 Flex
        reasoning: true
        input: [text]
        contextWindow: 1048560
        maxTokens: 65536
